name: Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # BEST PRACTICE: Use the official Docker action for a secure login.
      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # This MUST be a Docker Hub Access Token

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/codeveritus-backend:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/codeveritus-backend:latest

  deploy:
    name: Deploy to Alpine via Native Local SSH
    runs-on: self-hosted # GitHub sends the trigger to your ultra-light LXC
    needs: build
    steps:
      - name: Native SSH Execution
        # We use standard bash to pipe the deployment script directly into the Alpine VM over native SSH.
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_DIR }}

            echo "🛠️ Creating pristine .env file from secrets..."
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" > .env
            echo "JWT_SECRET_TOKEN=${{ secrets.JWT_SECRET_TOKEN }}" >> .env
            echo "MODEL_API=${{ secrets.MODEL_API }}" >> .env
            echo "PORT=${{ secrets.PORT }}" >> .env
            echo "SALTROUNDS=${{ secrets.SALTROUNDS }}" >> .env

            echo "🛠️ Pulling latest Docker image..."
            docker compose pull backend 

            echo "🚀 Recreating backend container..."
            docker compose up -d --force-recreate --remove-orphans backend

            echo "🧹 Pruning old images..."
            docker images --filter "dangling=true" --filter "reference=${{ secrets.DOCKER_USERNAME }}/codeveritus-backend" -q | xargs -r docker rmi

            echo "✅ Native Deployment complete!"
          EOF
